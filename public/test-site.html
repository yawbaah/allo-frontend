<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allo Widget Local Sandbox Integration</title>
  <style>
    body {
      background-color: #0b0b0f;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .card {
      background: #12121a;
      border: 1px solid #27273a;
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }
    p {
      color: #a1a1aa;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      background: #10b981;
      color: #000;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div style="margin-bottom: 15px;"><span class="badge">SANDBOX RUNNING</span></div>
    <h1>Allo Live Chat Testing environment</h1>
    <p>This page loads the widget from your local development stack and communicates with Daphne via port 8000.</p>
  </div>

  <!-- 
    ======================================================================
    ALLO CHATBOT EMBED WIDGET CODE
    ======================================================================
    - Replace `YOUR-COMPANY-UUID` with your company ID from the Deploy page
    - Make sure Daphne is running locally on port 8000
  -->
  <script
    src="http://localhost:5173/widget.js"
    data-company-id="YOUR-COMPANY-UUID-HERE"
    data-name="Allo Support"
    data-color="#10b981"
    data-position="right"
    data-launcher="icon"
    async
  ></script>

</body>
</html>
